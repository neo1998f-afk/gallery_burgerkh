
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger Khoone | Project Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="gallery-header">

        <div class="container">

            <span class="eyebrow">
                BURGER KHOONE
            </span>

            <h1>
                گالری پروژه
            </h1>

            <p>
              تصاویر طراحی و بخش های مختلف برگرخونه با بیش از 20 ویجت اختصاصی المنتور
            </p>

        </div>

    </header>


    <!-- =========================
         GALLERY
    ========================== -->
    <main>

        <div class="container">

            <section class="gallery">

                <!-- Image 01 -->
                <div class="gallery-card featured">

                    <img
                        src="picters/home.png"
                        alt="صفحه اصلی Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            01
                        </span>

                        <div>
                            <h2>صفحه اصلی</h2>
                            <span>Homepage</span>
                        </div>

                    </div>

                </div>


                <!-- Image 02 -->
                <div class="gallery-card">

                    <img
                        src="picters/meno.png"
                        alt="صفحه محصولات Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            02
                        </span>

                        <div>
                            <h2>محصولات</h2>
                            <span>Products</span>
                        </div>

                    </div>

                </div>


                <!-- Image 03 -->
                <div class="gallery-card">

                    <img
                        src="picters/about.png"
                        alt="صفحه درباره ما Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            03
                        </span>

                        <div>
                            <h2>درباره ما</h2>
                            <span>About Us</span>
                        </div>

                    </div>

                </div>


                <!-- Image 04 -->
                <div class="gallery-card">

                    <img
                        src="picters/gallery.png"
                        alt="گالری Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            04
                        </span>

                        <div>
                            <h2>گالری</h2>
                            <span>Gallery</span>
                        </div>

                    </div>

                </div>


                <!-- Image 05 -->
                <div class="gallery-card wide">

                    <img
                        src="picters/contact2.png"
                        alt="صفحه تماس با ما Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            05
                        </span>

                        <div>
                            <h2>تماس با ما</h2>
                            <span>Contact</span>
                        </div>

                    </div>

                </div>


                <!-- Image 06 -->
                <div class="gallery-card">

                    <img
                        src="picters/cart.png"
                        alt="صفحه رزرو Burger Khoone"
                    >

                    <div class="overlay">

                        <span class="number">
                            06
                        </span>

                        <div>
                            <h2>رزرو</h2>
                            <span>سبد خرید</span>
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer>

        <div class="container">

            <span>
                © Burger Khoone
            </span>

            <span>
                Creative Web Project
            </span>

        </div>

    </footer>

</body>
</html>
